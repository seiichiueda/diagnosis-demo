<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>基幹システム 操作マニュアル</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --accent-soft: #dbeafe;
      --ok: #047857;
      --warn: #b45309;
      --danger: #b91c1c;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    button { font: inherit; cursor: pointer; }

    /* ---------- ヘッダー ---------- */
    .app-header {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .app-header h1 { margin: 0; font-size: 1.45rem; letter-spacing: 0.04em; }
    .app-header p { margin: 2px 0 0; opacity: 0.9; font-size: 0.88rem; }
    .app-header .spacer { flex: 1; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid transparent; border-radius: 10px;
      padding: 8px 14px; font-weight: 700; font-size: 0.9rem;
      background: var(--accent); color: #fff; transition: 0.15s ease;
    }
    .btn:hover { background: var(--accent-dark); }
    .btn.light { background: #fff; color: var(--accent-dark); }
    .btn.light:hover { background: #eff6ff; }
    .btn.ghost { background: #fff; color: var(--text); border-color: #d1d5db; }
    .btn.ghost:hover { background: #f3f4f6; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn svg { width: 16px; height: 16px; }

    /* ---------- レイアウト ---------- */
    .layout {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 16px 48px;
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    /* ---------- ステップ一覧 ---------- */
    .steps { padding: 14px; position: sticky; top: 16px; }
    .steps-head { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 6px 10px; }
    .steps-head h2 { margin: 0; font-size: 1rem; }
    .steps-head span { font-size: 0.8rem; color: var(--muted); }
    .steps-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .step-item {
      width: 100%; display: flex; align-items: center; gap: 10px;
      text-align: left; background: #fff; border: 1px solid transparent; border-radius: 12px;
      padding: 9px 10px; color: var(--text); font-size: 0.93rem;
    }
    .step-item:hover { background: #f3f6fb; }
    .step-item.active { background: var(--accent-soft); border-color: #bfdbfe; font-weight: 700; }
    .step-item .num {
      flex: none; width: 30px; height: 30px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      background: #eef2f7; color: #475569; font-weight: 700; font-size: 0.85rem;
    }
    .step-item.active .num { background: var(--accent); color: #fff; }
    .step-item .t { flex: 1; line-height: 1.35; }
    .step-item .done { flex: none; color: var(--ok); font-size: 0.8rem; visibility: hidden; }
    .step-item.visited .done { visibility: visible; }

    /* ---------- プレーヤー ---------- */
    .content { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; min-width: 0; }
    .player { padding: 14px; }
    .browser { border: 1px solid #cfd6e1; border-radius: 12px; overflow: hidden; background: #fff; }
    .browser-bar {
      height: 34px; background: #eef1f5; border-bottom: 1px solid #d8dee8;
      display: flex; align-items: center; gap: 6px; padding: 0 12px;
    }
    .browser-bar i { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; display: inline-block; }
    .browser-bar i:nth-child(1) { background: #f87171; }
    .browser-bar i:nth-child(2) { background: #fbbf24; }
    .browser-bar i:nth-child(3) { background: #34d399; }
    .url {
      margin-left: 10px; flex: 1; height: 22px; border-radius: 999px; background: #fff;
      border: 1px solid #d8dee8; font-size: 12px; color: #64748b; padding: 0 12px;
      display: block; line-height: 20px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .stage { position: relative; width: 100%; aspect-ratio: 960 / 600; overflow: hidden; background: #fff; }

    .controls { display: flex; align-items: center; gap: 10px; padding: 12px 2px 2px; flex-wrap: wrap; }
    .progress { flex: 1; min-width: 120px; height: 6px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
    .progress > div { height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }
    .speed { display: inline-flex; border: 1px solid #d1d5db; border-radius: 10px; overflow: hidden; }
    .speed button { border: 0; background: #fff; padding: 6px 9px; font-size: 0.8rem; color: var(--muted); }
    .speed button.on { background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; }
    .loop { display: inline-flex; align-items: center; gap: 5px; font-size: 0.82rem; color: var(--muted); }
    .counter { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ---------- 説明文 ---------- */
    .desc { padding: 20px 22px; }
    .desc-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      height: 28px; padding: 0 12px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; font-size: 0.85rem;
    }
    .desc-head h2 { margin: 0; font-size: 1.3rem; flex: 1; }
    .d-purpose { margin: 0 0 14px; }
    .d-cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
    .d-cols h3 { margin: 0 0 6px; font-size: 0.95rem; }
    .d-cols ol, .d-cols ul { margin: 0; padding-left: 1.4em; }
    .d-cols li { margin-bottom: 4px; }
    .d-notes { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 12px 14px; }
    .d-notes h3 { color: var(--warn); }
    .nav-row { display: flex; justify-content: space-between; margin-top: 16px; gap: 10px; }

    .warn-bar { background: #fef3c7; color: #92400e; border-bottom: 1px solid #fde68a; padding: 8px 16px; font-size: 0.9rem; font-weight: 700; text-align: center; }
    #print-root { position: fixed; left: -20000px; top: 0; width: 720px; }
    .vid { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #0f172a; object-fit: contain; }
    .browser[data-mode="video"] .browser-bar { display: none; }
    .browser:not([data-mode="video"]) .vid { display: none; }
    .browser:not([data-mode="demo"]) .stage > .cv { display: none; }
    .vcap { font-size: clamp(12px, 2.1vw, 18px); bottom: 5%; white-space: normal; }
    .stage-note {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      text-align: center; padding: 24px; color: var(--muted); background: #f8fafc; font-size: 0.95rem;
    }
    .browser[data-mode="none"] .stage-note { display: flex; }
    .demo-badge {
      position: absolute; top: 10px; right: 10px; z-index: 30; display: none;
      background: #fef3c7; color: #92400e; border: 1px solid #fde68a;
      font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px;
    }
    .browser[data-mode="demo"] .demo-badge { display: block; }
    .p-screen canvas { display: block; width: 100%; height: auto; }

    /* ---------- スマホ ---------- */
    @media (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 40px; gap: 14px; }
      .steps { position: static; padding: 10px; min-width: 0; }
      .steps-head { padding-bottom: 6px; }
      .steps-list { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
      .step-item { width: auto; white-space: nowrap; padding: 6px 10px; }
      .step-item .done { display: none; }
      .d-cols { grid-template-columns: minmax(0, 1fr); }
      .app-header { padding: 14px 16px; }
      .app-header h1 { font-size: 1.2rem; }
      .desc { padding: 16px; }
      .desc-head h2 { flex-basis: 100%; order: -1; }
    }

    /* =========================================================
       模擬画面（基幹システム風）：960x600 の論理キャンバスを拡大縮小
       ========================================================= */
    .cv {
      position: absolute; left: 0; top: 0; width: 960px; height: 600px;
      transform-origin: 0 0; overflow: hidden; background: #fff;
      font-size: 13px; line-height: 1.5; color: #1e293b;
      pointer-events: none; user-select: none;
      font-family: "Hiragino Sans", "Meiryo", system-ui, sans-serif;
    }
    .cv .scr { position: absolute; inset: 0; transition: opacity 0.18s ease; }
    .cv .scr.fade { opacity: 0; }
    .cv .fx { position: absolute; inset: 0; z-index: 5; }
    .is-hidden { display: none !important; }

    .sys-shell { display: flex; flex-direction: column; height: 100%; }
    .sys-top { height: 46px; flex: none; background: #1e3a5f; color: #fff; display: flex; align-items: center; padding: 0 16px; gap: 14px; }
    .sys-logo { font-weight: 700; letter-spacing: 0.06em; font-size: 15px; }
    .sys-user { margin-left: auto; font-size: 12px; opacity: 0.92; padding: 2px 6px; }
    .sys-logout { height: 26px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.6); border-radius: 3px; font-size: 12px; display: flex; align-items: center; }
    .sys-body { flex: 1; display: flex; min-height: 0; }
    .sys-nav { width: 168px; flex: none; background: #eef2f7; border-right: 1px solid #d5dce6; padding: 10px 0; }
    .sys-nav div { padding: 9px 16px; font-size: 13px; color: #334155; }
    .sys-nav .on { background: #dbe6f5; color: #1e3a5f; font-weight: 700; border-left: 4px solid #1e3a5f; padding-left: 12px; }
    .sys-main { flex: 1; padding: 12px 22px; position: relative; min-width: 0; }
    .sys-crumb { font-size: 11px; color: #64748b; }
    .sys-h { font-size: 18px; margin: 2px 0 12px; padding-bottom: 6px; border-bottom: 2px solid #1e3a5f; color: #1e3a5f; display: flex; align-items: center; }
    .sys-h .acts { margin-left: auto; display: flex; gap: 8px; }

    .cv input, .cv select {
      font: inherit; font-size: 13px; border: 1px solid #9aa8ba; border-radius: 3px;
      padding: 4px 8px; background: #fff; width: 100%; height: 30px; color: #0f172a; margin: 0;
    }
    .cv .ro { background: #f8fafc; border-color: #e2e8f0; }
    .cv .is-focus { outline: 2px solid #f59e0b; background: #fffbeb; }
    .f-grid { display: grid; grid-template-columns: 112px 1fr 112px 1fr; gap: 8px 10px; align-items: center; }
    .f-label { background: #f1f5f9; border: 1px solid #d5dce6; padding: 4px 8px; font-size: 12px; font-weight: 600; height: 30px; display: flex; align-items: center; }
    .f-val { padding: 4px 2px; }
    .sbtn {
      display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 18px;
      border-radius: 3px; border: 1px solid #1e3a5f; background: #1e3a5f; color: #fff; font-size: 13px; font-weight: 600;
      transition: transform 0.1s, filter 0.1s;
    }
    .sbtn.sub { background: #fff; color: #1e3a5f; }
    .sbtn.ok { background: #047857; border-color: #047857; }
    .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin: 12px 0; }
    .is-pressed { transform: scale(0.95); filter: brightness(0.85); }
    table.st { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .st th { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 5px 8px; text-align: left; font-weight: 600; }
    .st td { border: 1px solid #e2e8f0; padding: 6px 8px; }
    .st td.r, .st th.r { text-align: right; }
    .st tr.is-pressed, .st tr.sel td { background: #fef3c7; }
    .st tr.is-pressed { transform: none; }
    .sec-h { font-weight: 700; color: #1e3a5f; margin: 14px 0 6px; font-size: 13px; border-left: 4px solid #1e3a5f; padding-left: 8px; }
    .empty { border: 1px dashed #cbd5e1; color: #94a3b8; text-align: center; padding: 40px 0; margin-top: 10px; }
    .muted { color: #64748b; font-size: 12px; }

    /* ログイン */
    .sys-login { height: 100%; background: linear-gradient(160deg, #1e3a5f, #345b8c); display: flex; align-items: center; justify-content: center; }
    .login-box { width: 360px; background: #fff; border-radius: 6px; padding: 26px 30px; box-shadow: 0 12px 30px rgba(0,0,0,0.25); }
    .login-logo { font-size: 20px; font-weight: 700; color: #1e3a5f; text-align: center; letter-spacing: 0.08em; }
    .login-sub { text-align: center; color: #64748b; font-size: 12px; margin: 4px 0 16px; }
    .login-box label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; }
    .login-box .sbtn { width: 100%; margin-top: 18px; height: 36px; }
    .login-foot { margin-top: 14px; font-size: 11px; color: #94a3b8; text-align: center; }

    /* メニュー */
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .tile { border: 1px solid #cbd5e1; border-radius: 6px; padding: 14px; display: flex; gap: 12px; align-items: center; background: #fff; transition: transform 0.1s, filter 0.1s; }
    .tile .ic { width: 42px; height: 42px; border-radius: 8px; color: #fff; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; flex: none; }
    .tile b { display: block; font-size: 14px; color: #1e3a5f; }
    .tile span { font-size: 11.5px; color: #64748b; }
    .notice { margin-top: 16px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .notice-h { background: #f1f5f9; padding: 6px 12px; font-weight: 700; color: #1e3a5f; border-bottom: 1px solid #cbd5e1; }
    .notice ul { margin: 0; padding: 6px 12px; list-style: none; }
    .notice li { padding: 4px 0; border-bottom: 1px dotted #e2e8f0; font-size: 12.5px; }
    .notice li:last-child { border-bottom: 0; }
    .notice li span { color: #64748b; margin-right: 10px; }

    /* 受注・完了・帳票 */
    .cust-box { border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 4px; padding: 8px 12px; display: flex; gap: 24px; }
    .entry { display: grid; grid-template-columns: 1fr 90px auto; gap: 8px; align-items: end; margin-top: 6px; }
    .entry label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 3px; }
    .totals { margin-left: auto; width: 260px; margin-top: 8px; }
    .totals div { display: flex; justify-content: space-between; padding: 3px 8px; border-bottom: 1px solid #e2e8f0; }
    .totals .grand { font-weight: 700; font-size: 15px; color: #1e3a5f; background: #eef2f7; }
    .done-wrap { text-align: center; padding-top: 30px; }
    .done-ic { width: 64px; height: 64px; border-radius: 50%; background: #047857; color: #fff; font-size: 34px; display: inline-flex; align-items: center; justify-content: center; }
    .done-wrap h3 { color: #047857; font-size: 20px; margin: 10px 0 4px; }
    .slip { display: inline-block; margin: 16px auto; border: 2px solid #1e3a5f; border-radius: 6px; padding: 10px 26px; }
    .slip small { display: block; color: #64748b; }
    .slip b { font-size: 24px; letter-spacing: 0.06em; color: #1e3a5f; }
    .preview { margin-top: 12px; border: 1px solid #cbd5e1; background: #e2e8f0; padding: 12px; display: flex; justify-content: center; }
    .paper { width: 420px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); padding: 14px 18px; font-size: 11px; }
    .paper h4 { margin: 0 0 6px; text-align: center; letter-spacing: 0.4em; font-size: 15px; }
    .paper .st { font-size: 10.5px; }
    .paper .st td, .paper .st th { padding: 2px 5px; }

    /* モーダル */
    .sys-modal { position: absolute; inset: 0; background: rgba(15,23,42,0.4); display: flex; align-items: center; justify-content: center; z-index: 3; }
    .sys-dialog { width: 380px; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
    .sys-dialog .dh { background: #1e3a5f; color: #fff; padding: 8px 14px; font-weight: 700; }
    .sys-dialog .db { padding: 18px 16px; }
    .sys-dialog .btn-row { margin: 0; padding: 0 16px 14px; }

    /* 演出レイヤー */
    .cursor { position: absolute; left: 0; top: 0; z-index: 20; width: 26px; height: 26px; will-change: transform; }
    .cursor svg { width: 26px; height: 26px; display: block; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.35)); }
    .cursor.mark::before {
      content: ""; position: absolute; left: -22px; top: -22px; width: 44px; height: 44px;
      border: 3px solid #ef4444; border-radius: 50%;
    }
    .ripple {
      position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
      border: 3px solid #f59e0b; animation: ripple 0.55s ease-out forwards; z-index: 19;
    }
    @keyframes ripple { to { transform: scale(3.6); opacity: 0; } }
    .hl {
      position: absolute; z-index: 6; border: 3px solid #ef4444; border-radius: 6px;
      box-shadow: 0 0 0 2000px rgba(15, 23, 42, 0.28);
      transition: left 0.25s, top 0.25s, width 0.25s, height 0.25s;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { border-color: #f97316; } }
    .cap {
      position: absolute; z-index: 15; left: 50%; bottom: 20px; transform: translateX(-50%);
      max-width: 82%; background: rgba(17, 24, 39, 0.9); color: #fff;
      padding: 10px 22px; border-radius: 999px; font-size: 17px; font-weight: 700; text-align: center; white-space: nowrap;
    }
    .cap.pop { animation: pop 0.25s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateX(-50%) translateY(8px); } }
    .toast {
      position: absolute; z-index: 14; right: 18px; top: 58px; background: #047857; color: #fff;
      padding: 9px 16px; border-radius: 6px; font-weight: 700; box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }
    .fdd { position: absolute; background: #fff; border: 1px solid #64748b; box-shadow: 0 6px 14px rgba(0,0,0,0.2); z-index: 7; }
    .fdd div { padding: 4px 8px; font-size: 13px; height: 28px; display: flex; align-items: center; }
    .fdd .cur { background: #f1f5f9; }
    .fdd .on { background: #2563eb; color: #fff; }

    @media (prefers-reduced-motion: reduce) {
      .hl, .cap.pop, .ripple { animation: none; }
    }

    /* =========================================================
       印刷
       ========================================================= */
    @page { size: A4 portrait; margin: 12mm; }
    @media print {
      body { background: #fff; }
      .app-header, .layout { display: none !important; }
      #print-root { position: static; width: auto; left: auto; }
      .p-step, .p-cover { break-after: page; page-break-after: always; }
      .p-step:last-child, .p-cover:last-child, #print-root .last { break-after: auto; page-break-after: auto; }
      #print-root .skip { display: none !important; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    .p-cover { padding-top: 40px; }
    .p-cover h1 { font-size: 26px; margin: 0 0 4px; }
    .p-cover .sub { color: var(--muted); margin-bottom: 30px; }
    .p-cover ol { font-size: 15px; line-height: 2; }
    .p-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
    .p-head h2 { margin: 0; font-size: 20px; }
    .p-screen { position: relative; overflow: hidden; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 14px; }
    .p-desc { font-size: 13.5px; }
    .p-desc .d-cols { grid-template-columns: 1.3fr 1fr; }
  </style>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>基幹システム 操作マニュアル</h1>
      <p>左のステップを選ぶと、操作の流れが画面上で再生されます。</p>
    </div>
    <div class="spacer"></div>
    <button class="btn light" id="print-all" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>
      全ステップを印刷
    </button>
  </header>

  <div class="layout">
    <aside class="card steps" aria-label="ステップ一覧">
      <div class="steps-head"><h2>ステップ</h2><span id="visited-count"></span></div>
      <ol class="steps-list" id="steps-list"></ol>
    </aside>

    <main class="content">
      <section class="card player" aria-label="操作の再生">
        <div class="browser">
          <div class="browser-bar"><i></i><i></i><i></i><div class="url" id="url"></div></div>

/* =====================================================================
   3. 再生エンジン
   ===================================================================== */
const W = 960, H = 600;
const CANCEL = Symbol('cancel');
const CURSOR_SVG = '<svg viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.5 15 L11.5 22 L14.5 20.7 L11.6 14 L17.5 14 Z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const ease = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

class Runner {
  constructor() { this.paused = false; this.cancelled = false; }
  async frame() {
    await new Promise(r => requestAnimationFrame(() => r()));
    while (this.paused && !this.cancelled) await new Promise(r => setTimeout(r, 60));
    if (this.cancelled) throw CANCEL;
  }
  async tween(ms, fn) {
    let t = 0, last = performance.now();
    fn(0);
    while (t < ms) {
      await this.frame();
      const now = performance.now();
      t += Math.min(now - last, 50) * state.speed;
      last = now;
      fn(Math.min(t / ms, 1));
    }
  }
  sleep(ms) { return this.tween(ms, () => {}); }
}

function makeCanvas() {
  const cv = document.createElement('div');
  cv.className = 'cv';
  cv.innerHTML = `<div class="scr"></div><div class="fx"></div><div class="hl is-hidden"></div>
    <div class="toast is-hidden"></div><div class="cap is-hidden"></div><div class="cursor">${CURSOR_SVG}</div>`;
  return cv;
}
function makeCtx(cv, runner) {
  const $c = s => cv.querySelector(s);
  return { cv, scr: $c('.scr'), fx: $c('.fx'), hl: $c('.hl'), toast: $c('.toast'), cap: $c('.cap'), cursor: $c('.cursor'),
    pos: { x: 700, y: 470 }, runner, instant: !runner, moved: false, onScreen: null };
}
const sleep = (ctx, ms) => ctx.instant ? Promise.resolve() : ctx.runner.sleep(ms);

function setScreen(ctx, name, data) {
  ctx.scr.innerHTML = SCREENS[name](data || {});
  ctx.fx.innerHTML = '';
  ctx.hl.classList.add('is-hidden');
  if (ctx.onScreen) ctx.onScreen(name);
}
function resetCanvas(ctx, step) {
  setScreen(ctx, step.screen, step.data);
  ctx.cap.classList.add('is-hidden');
  ctx.toast.classList.add('is-hidden');
  ctx.cursor.classList.remove('mark');
  ctx.moved = false;
  placeCursor(ctx, 700, 470);
}
function placeCursor(ctx, x, y) {
  ctx.pos = { x, y };
  ctx.cursor.style.transform = `translate(${x - 4}px, ${y - 2}px)`;
}
function q(ctx, sel) {
  if (typeof sel !== 'string') return sel;
  const el = ctx.scr.querySelector(sel);
  if (!el) console.warn('対象が見つかりません:', sel);
  return el;
}
function box(ctx, el) {
  const c = ctx.cv.getBoundingClientRect(), r = el.getBoundingClientRect();
  const s = c.width / W || 1;
  return { left: (r.left - c.left) / s, top: (r.top - c.top) / s, w: r.width / s, h: r.height / s };
}
function setCaption(ctx, text) {
  if (!text) { ctx.cap.classList.add('is-hidden'); return; }
  ctx.cap.textContent = text;
  ctx.cap.classList.remove('is-hidden', 'pop');
  if (!ctx.instant) { void ctx.cap.offsetWidth; ctx.cap.classList.add('pop'); }
}
function setFocus(ctx, el) {
  ctx.scr.querySelectorAll('.is-focus').forEach(e => e.classList.remove('is-focus'));
  if (el && el.matches('input, select')) el.classList.add('is-focus');
}
function ripple(ctx) {
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = ctx.pos.x + 'px';
  r.style.top = ctx.pos.y + 'px';
  ctx.fx.appendChild(r);
  setTimeout(() => r.remove(), 700);
}

const ACT = {
  async move(ctx, a) {
    const el = q(ctx, a.target); if (!el) return;
    const b = box(ctx, el);
    const tx = b.left + Math.min(b.w * 0.5, 60), ty = b.top + b.h * 0.55;
    ctx.moved = true;
    if (ctx.instant) return placeCursor(ctx, tx, ty);
    const sx = ctx.pos.x, sy = ctx.pos.y;
    const ms = Math.max(350, Math.min(950, Math.hypot(tx - sx, ty - sy) * 1.3));
    await ctx.runner.tween(ms, p => { const e = ease(p); placeCursor(ctx, sx + (tx - sx) * e, sy + (ty - sy) * e); });
    await sleep(ctx, 120);
  },
  async click(ctx, a) {
    await ACT.move(ctx, a);
    const el = q(ctx, a.target);
    if (!ctx.instant) {
      ripple(ctx);
      if (el) el.classList.add('is-pressed');
      await sleep(ctx, 170);
      if (el) el.classList.remove('is-pressed');
    }
    if (el) { setFocus(ctx, el); if (el.matches('tr')) el.classList.add('sel'); }
    await sleep(ctx, a.after ?? 280);
  },
  async type(ctx, a) {
    await ACT.click(ctx, { target: a.target, after: 120 });
    const el = q(ctx, a.target); if (!el) return;
    if (a.clear) {
      if (ctx.instant) el.value = '';
      while (el.value) { el.value = el.value.slice(0, -1); await sleep(ctx, 30); }
    }
    if (ctx.instant) { el.value += a.text; return; }
    for (const ch of a.text) { el.value += ch; await sleep(ctx, a.charMs || 90); }
    await sleep(ctx, 300);
  },
  async select(ctx, a) {
    const el = q(ctx, a.target); if (!el) return;
    const opts = [...el.options];
    const idx = Math.max(0, opts.findIndex(o => o.value === a.value || o.text === a.value));
    if (ctx.instant) { el.selectedIndex = idx; setFocus(ctx, el); ctx.moved = true; return ACT.move(ctx, a); }
    await ACT.click(ctx, { target: el, after: 100 });
    const b = box(ctx, el);
    const dd = document.createElement('div');
    dd.className = 'fdd';
    Object.assign(dd.style, { left: b.left + 'px', top: b.top + b.h + 'px', width: b.w + 'px' });
    dd.innerHTML = opts.map((o, i) => `<div class="${i === el.selectedIndex ? 'cur' : ''}">${esc(o.text)}</div>`).join('');
    ctx.fx.appendChild(dd);
    await sleep(ctx, 350);
    const opt = dd.children[idx];
    await ACT.move(ctx, { target: opt });
    opt.classList.add('on');
    await sleep(ctx, 200);
    ripple(ctx);
    await sleep(ctx, 150);
    el.selectedIndex = idx;
    dd.remove();
    await sleep(ctx, 350);
  },
  async highlight(ctx, a) {
    const el = q(ctx, a.target); if (!el) return;
    const b = box(ctx, el), p = a.pad ?? 5;
    Object.assign(ctx.hl.style, { left: b.left - p + 'px', top: b.top - p + 'px', width: b.w + p * 2 + 'px', height: b.h + p * 2 + 'px' });
    ctx.hl.classList.remove('is-hidden');
    if (ctx.instant) return;
    await sleep(ctx, a.ms ?? 1500);
    if (!a.keep) ctx.hl.classList.add('is-hidden');
  },
  async caption(ctx, a) { setCaption(ctx, a.text); await sleep(ctx, a.ms ?? 1100); },
  async screen(ctx, a) {
    if (ctx.instant) return setScreen(ctx, a.name, a.data);
    ctx.scr.classList.add('fade');
    await sleep(ctx, 200);
    setScreen(ctx, a.name, a.data);
    ctx.scr.classList.remove('fade');
    await sleep(ctx, a.ms ?? 500);
  },
  async reveal(ctx, a) { const el = q(ctx, a.target); if (el) el.classList.remove('is-hidden'); await sleep(ctx, a.ms ?? 500); },
  async toast(ctx, a) {
    ctx.toast.textContent = a.text;
    ctx.toast.classList.remove('is-hidden');
    if (ctx.instant) return;
    await sleep(ctx, a.ms ?? 1800);
    ctx.toast.classList.add('is-hidden');
  },
  async fn(ctx, a) { a.run(ctx.scr); await sleep(ctx, a.ms ?? 300); },
  async wait(ctx, a) { await sleep(ctx, a.ms ?? 800); }
};
async function runAction(ctx, a) {
  if (a.caption != null) setCaption(ctx, a.caption);
  await ACT[a.type](ctx, a);
}

/* 最終状態（印刷・動きを減らす設定用）を一気に描画 */
async function renderFinal(cv, step) {
  const ctx = makeCtx(cv, null);
  resetCanvas(ctx, step);
  for (const a of step.actions) await runAction(ctx, a);
  if (ctx.moved) ctx.cursor.classList.add('mark');
  return ctx;
}

      for (let i = 0; i < demo.actions.length; i++) {
        await runAction(ctx, demo.actions[i]);
        setProgress((i + 1) / demo.actions.length);
      }
      markVisited(state.idx);
      if (!$('#loop').checked) break;
      await runner.sleep(2800);
    }
    setStatus('ended');
  } catch (e) {
    if (e !== CANCEL) throw e;
  }
}
async function showDemoStill() {
  stopDemo();
  const demo = demoOf(STEPS[state.idx]);
  await renderFinal(playerCv, demo);
  setProgress(1);
  setStatus('ended');
  $('#url').textContent = 'https://kikan.example.co.jp' + (URLS[demo.screen] || '/');
}

/* 動画が無い・読めないとき */
function fallback() {
  video.removeAttribute('src');
  video.load();
  vcap.classList.add('is-hidden');
  const s = STEPS[state.idx];
  if (demoOf(s)) {
    setMode('demo');
    if (reduceMotion) showDemoStill(); else playDemo();
  } else {
    setMode('none');
    setProgress(0);
    setStatus('idle');
    stage.querySelector('.stage-note').innerHTML = s.video
      ? `動画ファイル「${esc(s.video)}」が見つかりません。<br>videos フォルダに動画を置くか、steps.js のファイル名を確認してください。`
      : 'このステップの動画は準備中です。';
  }
}

/* 動画イベント */
video.addEventListener('error', () => { if (state.mode === 'video' && video.getAttribute('src')) fallback(); });
video.addEventListener('loadedmetadata', () => {
  if (video.videoWidth && video.videoHeight) stage.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
});
video.addEventListener('play', () => { if (state.mode === 'video') setStatus('playing'); });
video.addEventListener('pause', () => { if (state.mode === 'video' && !video.ended) setStatus('paused'); });
video.addEventListener('ended', () => { if (state.mode === 'video') { markVisited(state.idx); setStatus('ended'); } });
video.addEventListener('timeupdate', () => {
  if (state.mode !== 'video' || !video.duration) return;
  const t = video.currentTime;
  setProgress(t / video.duration);
  if (t > video.duration - 0.6) markVisited(state.idx);
  const caps = (STEPS[state.idx].captions || []).filter(c => c.at <= t && (c.until == null || t < c.until));
  const c = caps[caps.length - 1];
  if (c && c.text) {
    if (vcap.textContent !== c.text) { vcap.textContent = c.text; vcap.classList.remove('pop'); void vcap.offsetWidth; vcap.classList.add('pop'); }
    vcap.classList.remove('is-hidden');
  } else vcap.classList.add('is-hidden');
});

function loadStep() {
  stopDemo();
  video.pause();
  vcap.classList.add('is-hidden');
  setProgress(0);
  const s = STEPS[state.idx];
  if (!s.video) return fallback();
  setMode('video');
  setStatus('idle');
  video.loop = $('#loop').checked;
  video.src = s.video;
  video.defaultPlaybackRate = video.playbackRate = state.speed;
  if (!reduceMotion) video.play().catch(() => {});
}

function play() {
  if (state.mode === 'video') { video.currentTime = 0; video.play().catch(() => {}); }
  else if (state.mode === 'demo') playDemo();
}
function togglePlay() {
  if (state.mode === 'video') {
    if (video.paused) video.play().catch(() => {}); else video.pause();
    return;
  }
  if (state.mode !== 'demo') return;
  if (state.status === 'playing') { state.runner.paused = true; setStatus('paused'); }
  else if (state.status === 'paused' && state.runner) { state.runner.paused = false; setStatus('playing'); }
  else playDemo();
}

function select(i) {
  state.idx = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[state.idx];
  renderList();
  const act = $('.step-item.active');
  if (act && window.matchMedia('(max-width: 900px)').matches) act.scrollIntoView({ block: 'nearest', inline: 'center' });
  $('#desc-badge').textContent = `STEP ${state.idx + 1}`;
  $('#desc-title').textContent = s.title || '';
  $('#desc-body').innerHTML = descHtml(s);
  $('#counter').textContent = `${state.idx + 1} / ${STEPS.length}`;
  $('#btn-prev').disabled = state.idx === 0;
  $('#btn-next').disabled = state.idx === STEPS.length - 1;
  if (location.hash !== `#step-${state.idx + 1}`) history.replaceState(null, '', `#step-${state.idx + 1}`);
  loadStep();
}

/* ---------- 操作イベント ---------- */
$('#steps-list').addEventListener('click', e => {
  const b = e.target.closest('.step-item');
  if (b) select(+b.dataset.i);
});
$('#btn-prev').addEventListener('click', () => select(state.idx - 1));
$('#btn-next').addEventListener('click', () => select(state.idx + 1));
$('#btn-restart').addEventListener('click', play);
$('#btn-play').addEventListener('click', togglePlay);
$('#loop').addEventListener('change', e => { video.loop = e.target.checked; });

$('#speed').innerHTML = [0.5, 1, 1.5, 2].map(v => `<button type="button" data-v="${v}" class="${v === 1 ? 'on' : ''}">${v}x</button>`).join('');
$('#speed').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.speed = +b.dataset.v;
  video.defaultPlaybackRate = video.playbackRate = state.speed;
  $('#speed').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
});

document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') select(state.idx + 1);
  else if (e.key === 'ArrowLeft') select(state.idx - 1);
  else if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); togglePlay(); }
});
window.addEventListener('hashchange', () => {
  const m = location.hash.match(/^#step-(\d+)$/);
  if (m && +m[1] - 1 !== state.idx) select(+m[1] - 1);
});

/* =====================================================================
   5. 印刷（各ステップの代表場面＋説明文。動画が無い場合は見本画面）
   ===================================================================== */
const PRINT_W = 680;

/* 動画の指定秒のコマを canvas に写す */
function captureFrame(src, at) {
  return new Promise((resolve, reject) => {
    const v = document.createElement('video');
    v.muted = true;
    v.preload = 'auto';
    let done = false;
    const finish = (ok, val) => { if (done) return; done = true; clearTimeout(timer); v.removeAttribute('src'); v.load(); ok ? resolve(val) : reject(val); };
    const timer = setTimeout(() => finish(false, 'timeout'), 10000);
    v.addEventListener('error', () => finish(false, 'error'));
    v.addEventListener('loadedmetadata', () => {
      const d = v.duration || 0;
      v.currentTime = at != null ? Math.min(Math.max(at, 0), Math.max(d - 0.05, 0)) : Math.max(d - 1, 0);
    });
    v.addEventListener('seeked', () => {
      const c = document.createElement('canvas');
      c.width = v.videoWidth;
      c.height = v.videoHeight;
      c.getContext('2d').drawImage(v, 0, 0);
      finish(true, c);
    });
    v.src = src;
  });
}

let printPromise = null;
function buildPrint() {
  if (!printPromise) printPromise = (async () => {
    const root = $('#print-root');
    root.innerHTML = '';
    const cover = document.createElement('section');
    cover.className = 'p-cover';
    cover.innerHTML = `<h1>${esc(MAN.title || '操作マニュアル')}</h1>
      <div class="sub">${esc(MAN.subtitle || '')}（全${STEPS.length}ステップ）　印刷日：${new Date().toLocaleDateString('ja-JP')}</div>
      <h2>目次</h2><ol>${STEPS.map(s => `<li>${esc(s.title || '')}</li>`).join('')}</ol>`;
    root.appendChild(cover);
    for (let i = 0; i < STEPS.length; i++) {
      const s = STEPS[i];
      const sec = document.createElement('section');
      sec.className = 'p-step';
      sec.dataset.i = i;
      sec.innerHTML = `<div class="p-head"><span class="badge">STEP ${i + 1}</span><h2>${esc(s.title || '')}</h2></div>`;
      const wrap = document.createElement('div');
      wrap.className = 'p-screen';
      wrap.style.width = PRINT_W + 'px';
      sec.appendChild(wrap);
      sec.insertAdjacentHTML('beforeend', `<div class="p-desc">${descHtml(s)}</div>`);
      root.appendChild(sec);
      let placed = false;
      if (s.video) {
        try { wrap.appendChild(await captureFrame(s.video, s.printAt)); placed = true; } catch (e) { /* 動画なし → 見本画面 */ }
      }
      if (!placed && demoOf(s)) {
        wrap.style.height = PRINT_W * H / W + 'px';
        const cv = makeCanvas();
        cv.style.transform = `scale(${PRINT_W / W})`;
        wrap.appendChild(cv);
        await renderFinal(cv, demoOf(s));
      } else if (!placed) {
        wrap.remove();
      }
    }
  })();
  return printPromise;
}
function choosePrint(only) {
  const secs = [...document.querySelectorAll('#print-root section')];
  secs.forEach(sec => {
    sec.classList.toggle('skip', only != null && sec.dataset.i !== String(only));
    sec.classList.remove('last');
  });
  const shown = secs.filter(sec => !sec.classList.contains('skip'));
  if (shown.length) shown[shown.length - 1].classList.add('last');
}
async function doPrint(only) {
  await buildPrint();
  choosePrint(only);
  state.printReady = true;
  window.print();
}
$('#print-all').addEventListener('click', () => doPrint(null));
$('#print-one').addEventListener('click', () => doPrint(state.idx));
/* ブラウザのメニュー（Ctrl+P）から印刷した場合は全ステップ */
window.addEventListener('beforeprint', () => { if (!state.printReady) choosePrint(null); });
window.addEventListener('afterprint', () => { state.printReady = false; });

window.ManualApp = { STEPS, DEMOS, buildPrint, choosePrint, select, state, video };

/* ---------- 起動 ---------- */
if (STEPS_JS_BROKEN) {
  $('.app-header').insertAdjacentHTML('afterend', `<div class="warn-bar">steps.js を読み込めなかったため、標準の内容を表示しています。steps.js の書き方（' や , の抜け）を確認してください。</div>`);
}
if (MAN.title) { $('.app-header h1').textContent = MAN.title; document.title = MAN.title; }
const m = location.hash.match(/^#step-(\d+)$/);
select(m ? +m[1] - 1 : 0);
/* Ctrl+P でも印刷できるよう、印刷用ページを裏で準備しておく */
setTimeout(buildPrint, 1500);

</script>
</body>
</html>
